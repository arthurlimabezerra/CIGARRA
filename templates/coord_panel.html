<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Coordenação | POLI UPE</title>
    <style>
        :root {
            --azul-upe: #003366;
            --azul-hover: #004d99;
            --vermelho-upe: #cc0000;
            --verde-sucesso: #28a745;
            --laranja-alerta: #ff9500;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --bg-light: #f5f5f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { min-height: 100vh; background: var(--bg-light); color: var(--text-main); display: flex; justify-content: center; align-items: flex-start; padding: 25px 15px; }

        .main-card {
            width: 100%; max-width: 1200px; background: var(--glass-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 28px; padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e5ea; padding-bottom: 20px; margin-bottom: 25px;
        }

        /* Layout Master-Detail (Duas Colunas) */
        .panel-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            min-height: 550px;
        }

        /* Sidebar - Lista de Alunos */
        .sidebar-students {
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #d1d1d6;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--azul-upe); }

        .students-list {
            overflow-y: auto;
            max-height: 500px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .student-item {
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #f0f0f5;
            background: #f9f9fb;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .student-item:hover {
            background: #f0f4f8;
            border-color: #d0e0f0;
        }
        .student-item.active {
            background: var(--azul-upe);
            color: #ffffff;
            border-color: var(--azul-upe);
            box-shadow: 0 4px 12px rgba(0, 51, 102, 0.2);
        }
        .student-item.active .student-cpf,
        .student-item.active .student-count {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .student-info-name { font-weight: 600; font-size: 0.95rem; }
        .student-cpf { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
        .student-count {
            font-size: 0.75rem;
            background: rgba(0,0,0,0.06);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }
        .student-item.active .student-count {
            background: rgba(255,255,255,0.2);
        }

        /* Detalhes da Solicitação */
        .detail-pane {
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 20px;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .student-header-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5ea;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .card-solicitacao {
            background: #f9f9fb; border: 1px solid #e5e5ea; border-radius: 16px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .badge { padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; color: #fff; display: inline-block; }
        .Pendente { background: var(--laranja-alerta); }
        .Deferido { background: var(--verde-sucesso); }
        .Indeferido { background: var(--vermelho-upe); }

        .section-box { background: #ffffff; border-radius: 12px; padding: 12px; margin-top: 12px; border: 1px solid #e5e5ea; }
        
        .tag-item { display: inline-block; padding: 5px 10px; border-radius: 8px; font-size: 0.85rem; margin: 4px 4px 4px 0; font-weight: 600; }
        .tag-rem { background: #ffe5e5; color: var(--vermelho-upe); }
        .tag-add { background: #e5f0ff; color: var(--azul-upe); }

        .btn {
            padding: 8px 18px; border-radius: 99px; border: none; cursor: pointer; font-weight: 600;
            color: #fff; transition: all 0.2s; font-size: 0.88rem;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-deferir { background: var(--verde-sucesso); }
        .btn-indeferir { background: var(--vermelho-upe); }
        .btn-secondary { background-color: #e5e5ea; color: #1d1d1f; }
        .btn-secondary:hover { background-color: #d1d1d6; color: #000; }

        .btn-grade {
            background-color: #ffffff;
            color: var(--vermelho-upe);
            border: 1.5px solid var(--vermelho-upe);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-grade:hover {
            background-color: #fff5f5;
            transform: translateY(-1px);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: #ffffff; border-radius: 20px; width: 90%; max-width: 580px;
            padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #e5e5ea; padding-bottom: 12px; margin-bottom: 15px;
        }
        .btn-close {
            background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted);
        }
        .item-grade {
            background-color: #f9f9fb; border: 1px solid #e5e5ea; padding: 12px 16px;
            border-radius: 10px; margin-bottom: 10px;
        }

        .empty-state { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 1rem; }

        @media (max-width: 850px) {
            .panel-container { grid-template-columns: 1fr; }
            .sidebar-students { height: auto; }
            .students-list { max-height: 220px; }
        }
    </style>
</head>
<body>

    <main class="main-card">
        <header class="header-bar">
            <div>
                <h1 style="color: var(--azul-upe); font-size: 1.6rem;">Painel da Coordenação</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 4px;">POLI UPE • Gerenciamento de Solicitações de Modificação</p>
            </div>
            <button class="btn btn-secondary" onclick="fazerLogout()">Sair</button>
        </header>

        <div class="panel-container">
            <!-- Menu Lateral de Alunos -->
            <aside class="sidebar-students">
                <input type="text" id="search-student" class="search-box" placeholder="🔍 Buscar aluno ou CPF..." oninput="filtrarAlunos()">
                <div class="students-list" id="container-alunos-lista">
                    <div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.9rem;">Carregando alunos...</div>
                </div>
            </aside>

            <!-- Painel de Detalhes e Solicitações -->
            <section class="detail-pane" id="container-detalhe-aluno">
                <div class="empty-state">Selecione um aluno no menu à esquerda para visualizar suas solicitações.</div>
            </section>
        </div>
    </main>

    <!-- Modal para Grade Curricular -->
    <div id="modalGrade" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalAlunoNome" style="color: var(--azul-upe);">Grade Atual do Aluno</h3>
                <button class="btn-close" onclick="fecharModalGrade()">&times;</button>
            </div>
            <div id="conteudoGradeAluno" style="max-height: 380px; overflow-y: auto; padding-right: 5px;">
                <p style="text-align: center; color: var(--text-muted);">Carregando...</p>
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-secondary" onclick="fecharModalGrade()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        function escapeHTML(str) {
            if (!str) return 'Sem justificativa.';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
        let alunosAgrupados = {};
        let alunoSelecionadoId = null;

        async function carregar() {
            try {
                const res = await fetch('/coordenador/solicitacoes');
                if (res.status === 403 || res.status === 401) {
                    window.location.href = '/';
                    return;
                }
                const data = await res.json();
                
                if (!data.solicitacoes || data.solicitacoes.length === 0) {
                    document.getElementById('container-alunos-lista').innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size:0.9rem;">Nenhuma solicitação recebida.</div>';
                    document.getElementById('container-detalhe-aluno').innerHTML = '<div class="empty-state">Nenhuma solicitação cadastrada no sistema.</div>';
                    return;
                }

                // Agrupar solicitações por aluno_id
                alunosAgrupados = {};
                data.solicitacoes.forEach(s => {
                    if (!alunosAgrupados[s.aluno_id]) {
                        alunosAgrupados[s.aluno_id] = {
                            id: s.aluno_id,
                            nome: s.aluno_nome,
                            cpf: s.aluno_cpf,
                            solicitacoes: []
                        };
                    }
                    alunosAgrupados[s.aluno_id].solicitacoes.push(s);
                });

                renderizarListaAlunos();

                // Manter aluno selecionado ou selecionar o primeiro por padrão
                const ids = Object.keys(alunosAgrupados);
                if (ids.length > 0) {
                    if (!alunoSelecionadoId || !alunosAgrupados[alunoSelecionadoId]) {
                        alunoSelecionadoId = ids[0];
                    }
                    selecionarAluno(alunoSelecionadoId);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('container-detalhe-aluno').innerHTML = '<div class="empty-state" style="color: var(--vermelho-upe);">Erro ao carregar dados.</div>';
            }
        }

        function renderizarListaAlunos(filtro = '') {
            const container = document.getElementById('container-alunos-lista');
            container.innerHTML = '';

            const termo = filtro.toLowerCase().trim();
            const ids = Object.keys(alunosAgrupados);

            let encontrados = 0;

            ids.forEach(id => {
                const aluno = alunosAgrupados[id];
                if (aluno.nome.toLowerCase().includes(termo) || aluno.cpf.includes(termo)) {
                    encontrados++;
                    const item = document.createElement('div');
                    item.className = `student-item ${String(id) === String(alunoSelecionadoId) ? 'active' : ''}`;
                    item.onclick = () => selecionarAluno(id);

                    item.innerHTML = `
                        <div>
                            <div class="student-info-name">${aluno.nome}</div>
                            <div class="student-cpf">CPF: ${aluno.cpf}</div>
                        </div>
                        <div class="student-count">${aluno.solicitacoes.length} ${aluno.solicitacoes.length === 1 ? 'ped' : 'ped'}</div>
                    `;
                    container.appendChild(item);
                }
            });

            if (encontrados === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.85rem;">Nenhum aluno encontrado.</div>';
            }
        }

        function filtrarAlunos() {
            const termo = document.getElementById('search-student').value;
            renderizarListaAlunos(termo);
        }

        function selecionarAluno(alunoId) {
            alunoSelecionadoId = alunoId;
            const termoBusca = document.getElementById('search-student').value;
            renderizarListaAlunos(termoBusca);

            const aluno = alunosAgrupados[alunoId];
            const container = document.getElementById('container-detalhe-aluno');

            if (!aluno) {
                container.innerHTML = '<div class="empty-state">Aluno não encontrado.</div>';
                return;
            }

            let html = `
                <div class="student-header-detail">
                    <div>
                        <h2 style="color: var(--azul-upe); font-size: 1.3rem;">${aluno.nome}</h2>
                        <span style="color: var(--text-muted); font-size: 0.9rem;">CPF: ${aluno.cpf} • ${aluno.solicitacoes.length} solicitação(ões)</span>
                    </div>
                    <button class="btn-grade" onclick="verGradeAluno(${aluno.id}, '${aluno.nome}')">📋 Ver Grade Horária</button>
                </div>
                <div style="overflow-y: auto; max-height: 520px; padding-right: 5px;">
            `;

            aluno.solicitacoes.forEach((s) => {
                const remItens = s.itens ? s.itens.filter(i => i.tipo === 'REMOVER') : [];
                const addItens = s.itens ? s.itens.filter(i => i.tipo === 'ADICIONAR') : [];

                const dataFmt = s.data_solicitacao ? new Date(s.data_solicitacao).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

                html += `
                    <div class="card-solicitacao">
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #e5e5ea; padding-bottom: 10px; margin-bottom: 12px;">
                            <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Pedido #${s.numero_pedido_aluno || s.id} ${dataFmt ? '• ' + dataFmt : ''}</span>
                            <span class="badge ${s.status}">${s.status}</span>
                        </div>

                        <div style="margin-bottom: 12px;">
                            <strong style="color: var(--vermelho-upe); font-size: 0.88rem;">Remoções Solicitadas:</strong><br>
                            <div style="margin-top: 4px;">
                                ${remItens.length > 0 ? remItens.map(i => `<span class="tag-item tag-rem">✕ ${i.disciplina_nome} (${i.codigo_turma})</span>`).join('') : '<span style="color:#888; font-size:0.85rem;">Nenhuma matéria para remover</span>'}
                            </div>
                        </div>

                        <div style="margin-bottom: 12px;">
                            <strong style="color: var(--azul-upe); font-size: 0.88rem;">Adições Solicitadas:</strong><br>
                            <div style="margin-top: 4px;">
                                ${addItens.length > 0 ? addItens.map(i => `<span class="tag-item tag-add">✓ ${i.disciplina_nome} - ${i.codigo_turma} (${i.horario_descricao})</span>`).join('') : '<span style="color:#888; font-size:0.85rem;">Nenhuma matéria para adicionar</span>'}
                            </div>
                        </div>

                        <div class="section-box">
                            <strong style="font-size: 0.85rem; color: var(--text-main);">Justificativa:</strong>
                            <p style="margin-top: 4px; font-size: 0.9rem; color: #333; white-space: pre-line;">${escapeHTML(s.justificativa)}</p>
                            ${s.caminho_anexo ? `<div style="margin-top:8px;"><a href="/${s.caminho_anexo}" target="_blank" style="color: var(--azul-upe); font-weight: 600; font-size: 0.85rem; text-decoration: none;">📄 Visualizar Comprovante Anexo &rarr;</a></div>` : ''}
                        </div>

                        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
                            <button class="btn btn-deferir" onclick="mudarStatus(${s.id}, 'Deferido')">Deferir</button>
                            <button class="btn btn-indeferir" onclick="mudarStatus(${s.id}, 'Indeferido')">Indeferir</button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        async function verGradeAluno(alunoId, alunoNome) {
            const modal = document.getElementById('modalGrade');
            const conteudo = document.getElementById('conteudoGradeAluno');
            document.getElementById('modalAlunoNome').innerText = `Grade Atual - ${alunoNome}`;
            
            conteudo.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Carregando matérias...</p>';
            modal.style.display = 'flex';

            try {
                const res = await fetch(`/coordenador/grade-aluno/${alunoId}`);
                const data = await res.json();

                if (data.status === 'success') {
                    if (!data.matriculas || data.matriculas.length === 0) {
                        conteudo.innerHTML = '<p style="color: var(--text-muted); text-align:center; padding: 20px 0;">Nenhuma disciplina matriculada atualmente.</p>';
                    } else {
                        let html = '';
                        data.matriculas.forEach(item => {
                            html += `
                                <div class="item-grade">
                                    <strong style="color: var(--azul-upe); font-size: 0.95rem;">${item.disciplina_nome}</strong>
                                    <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 6px;">(Bloco ${item.bloco || 'N/A'})</span><br>
                                    <div style="font-size: 0.85rem; color: #444; margin-top: 4px;">
                                        Turma: <strong>${item.codigo_turma}</strong> | Horário: <span>${item.horario_descricao || 'Não informado'}</span>
                                    </div>
                                </div>
                            `;
                        });
                        conteudo.innerHTML = html;
                    }
                } else {
                    conteudo.innerHTML = `<p style="color: var(--vermelho-upe);">Erro: ${data.message}</p>`;
                }
            } catch (err) {
                conteudo.innerHTML = '<p style="color: var(--vermelho-upe);">Erro ao buscar grade do aluno.</p>';
            }
        }

        function fecharModalGrade() {
            document.getElementById('modalGrade').style.display = 'none';
        }

        async function mudarStatus(id, status) {
            const res = await fetch('/coordenador/alterar-status', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, status })
            });

            if (res.ok) {
                carregar();
            } else {
                alert('Erro ao atualizar o status da solicitação.');
            }
        }

        async function fazerLogout() {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/';
        }

        carregar();
    </script>
</body>
</html>
